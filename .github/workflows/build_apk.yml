name: Build & Send Heritage Batik APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Alamat email tujuan (opsional, jika dikosongkan akan memakai secret MAIL_TO)'
        required: false
        type: string

jobs:
  build-and-send:
    name: Build APK and Send via Email
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Ambil dependencies proyek
      - name: Install Dependencies
        run: flutter pub get

      # 5. Jalankan validasi pengujian (smoke test)
      - name: Run Tests
        run: flutter test

      # 6. Kompilasi APK Release
      - name: Build Android Release APK
        run: flutter build apk --release

      # 7. Ganti nama file APK menjadi heritage_batik.apk
      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/heritage_batik.apk
          echo "File size:"
          ls -lh build/app/outputs/flutter-apk/heritage_batik.apk

      # 8. Simpan APK sebagai Artifact di GitHub Actions
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heritage_batik-apk
          path: build/app/outputs/flutter-apk/heritage_batik.apk
          retention-days: 14

      # 9. Verifikasi Konfigurasi Email & Secrets
      - name: Check Email Configuration
        id: check_email
        run: |
          RECIPIENT="${{ inputs.recipient_email || secrets.MAIL_TO || secrets.EMAIL_TO }}"
          SMTP_USER="${{ secrets.MAIL_USERNAME || secrets.EMAIL_USERNAME }}"
          SMTP_PASS="${{ secrets.MAIL_PASSWORD || secrets.EMAIL_PASSWORD }}"
          SERVER="${{ secrets.MAIL_SERVER || 'sandbox.smtp.mailtrap.io' }}"
          PORT="${{ secrets.MAIL_PORT || '' }}"

          if [ -z "$PORT" ]; then
            if echo "$SERVER" | grep -qi "gmail"; then
              PORT="465"
            else
              PORT="2525"
            fi
          fi

          if [ -z "$RECIPIENT" ]; then
            echo "has_email=false" >> $GITHUB_OUTPUT
            echo "::warning title=Email Tidak Terkirim::Alamat email tujuan (Secret: MAIL_TO) belum diisi di GitHub Secrets. Pengiriman email dilewati."
          elif [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "has_email=false" >> $GITHUB_OUTPUT
            echo "::warning title=Kredensial SMTP Belum Lengkap::Secret MAIL_USERNAME atau MAIL_PASSWORD belum diisi. Pengiriman email dilewati."
          else
            echo "has_email=true" >> $GITHUB_OUTPUT
            echo "recipient=$RECIPIENT" >> $GITHUB_OUTPUT
            echo "smtp_user=$SMTP_USER" >> $GITHUB_OUTPUT
            echo "server_address=$SERVER" >> $GITHUB_OUTPUT
            echo "server_port=$PORT" >> $GITHUB_OUTPUT

            # Port 465 menggunakan direct SSL (secure: true)
            # Port 587, 2525, 25 (seperti Mailtrap / STARTTLS) wajib menggunakan secure: false
            if [ "$PORT" = "465" ]; then
              echo "is_secure=true" >> $GITHUB_OUTPUT
            else
              echo "is_secure=false" >> $GITHUB_OUTPUT
            fi

            echo "Konfigurasi email siap. Server: $SERVER, Port: $PORT, Penerima: $RECIPIENT"
          fi

      # 10. Kirim file APK ke email tujuan via SMTP (hanya jika email sudah dikonfigurasi)
      - name: Send APK via Email
        if: steps.check_email.outputs.has_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ steps.check_email.outputs.server_address }}
          server_port: ${{ steps.check_email.outputs.server_port }}
          username: ${{ steps.check_email.outputs.smtp_user }}
          password: ${{ secrets.MAIL_PASSWORD || secrets.EMAIL_PASSWORD }}
          subject: "Heritage Batik APK - Build Berhasil (#${{ github.run_number }})"
          to: ${{ steps.check_email.outputs.recipient }}
          from: "Heritage Batik CI/CD <${{ secrets.MAIL_FROM || 'no-reply@heritagebatiklaweyan.com' }}>"
          secure: ${{ steps.check_email.outputs.is_secure == 'true' }}
          html_body: |
            <h2>Halo Tim Heritage Batik,</h2>
            <p>Kompilasi APK untuk aplikasi <b>Heritage Batik Laweyan</b> telah selesai dibangun secara otomatis oleh GitHub Actions.</p>
            <ul>
              <li><b>Nama Berkas:</b> heritage_batik.apk</li>
              <li><b>Versi / Tag:</b> ${{ github.ref_name }}</li>
              <li><b>Nomor Build:</b> #${{ github.run_number }}</li>
              <li><b>Commit:</b> ${{ github.sha }}</li>
            </ul>
            <p>Berkas APK telah dilampirkan langsung pada email ini untuk dapat diunduh dan dipasang pada perangkat Android.</p>
            <br/>
            <p>Salam,<br/>Sistem Otomatisasi CI/CD Heritage Batik</p>
          attachments: build/app/outputs/flutter-apk/heritage_batik.apk

      # 11. Buat GitHub Release resmi jika dipicu oleh Git Tag (contoh: v0.1.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/heritage_batik.apk
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
